<style>
  text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}
  .bg{fill:#fcfcfb} .tile{fill:#f0efec;stroke:#d9d8d2} .sel{fill:#cfe0f6;stroke:#2a78d6}
  .hl{fill:#2a78d6} .area{fill:none;stroke:#eb6834;stroke-width:2.5;stroke-dasharray:7 5}
  .tn{fill:#52514e;font-size:13px} .tl{fill:#ffffff;font-size:14px;font-weight:700}
  .ax{fill:#7a7974;font-size:11px} .h{fill:#0b0b0b;font-size:17px;font-weight:700}
  .p{fill:#52514e;font-size:14px} .c{fill:#0b0b0b;font-size:13px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
  .ln{stroke:#a3a29b;stroke-width:1.2;fill:none} .px{fill:#2a78d6;opacity:.85}
  @media (prefers-color-scheme: dark){
    .bg{fill:#1a1a19} .tile{fill:#2a2a28;stroke:#383835} .sel{fill:#1f3550;stroke:#3987e5} .hl{fill:#3987e5}
    .area{stroke:#d95926} .tn{fill:#c3c2b7} .ax{fill:#8f8e88} .h{fill:#f0efec} .p{fill:#c3c2b7} .c{fill:#f0efec}
    .ln{stroke:#6b6a65} .px{fill:#3987e5}
  }
</style>
