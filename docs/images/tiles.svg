  <text class="p" x="0" y="94">One tile = 100 × 100 km</text>
  <text class="p" x="0" y="114">= 1,000 × 1,000 pixels of 100 m.</text>
  <g transform="translate(0,134)">
    <rect class="tile" x="0" y="0" width="80" height="80" rx="4"/>
    <rect class="px" x="0" y="0" width="8" height="8"/>
