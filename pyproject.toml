[project]
name = "egms-client"
version = "0.5.0"
description = "Client for the EGMS archive: CLMS service-key auth, search and download of L2A, L2B and Ortho L3, mosaics, GeoParquet, CLI"
readme = "README.md"
keywords = ["egms", "copernicus", "insar", "ground motion", "sentinel-1", "subsidence", "landslide", "clms"]
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [
    { name = "Giuseppe Zileni", email = "giuseppe.zileni@gmail.com" },
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: GIS",
    "Framework :: AsyncIO",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]
dependencies = [
    "cryptography>=43",
    "httpx>=0.27",
]

[project.scripts]
egms = "egms_client.cli:main"

[project.optional-dependencies]
raster = [
    "numpy>=2.0",
    "pyproj>=3.6",
    "rasterio>=1.4",
]
tables = [
    "pandas>=2.2",
    "pyarrow>=17",
    "pyproj>=3.6",
]
xarray = [
    "xarray>=2024.6",
]

[project.urls]
Homepage = "https://github.com/agent-engineering-studio/egms-client"
Issues = "https://github.com/agent-engineering-studio/egms-client/issues"
Changelog = "https://github.com/agent-engineering-studio/egms-client/blob/main/CHANGELOG.md"

[build-system]
requires = ["uv_build>=0.13.6,<0.14"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=1.13",
    "numpy>=2.0",
    "pyproj>=3.6",
    "rasterio>=1.4",
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "ruff>=0.8",
    "pandas>=2.2",
    "pyarrow>=17",
    "xarray>=2024.6",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM", "ARG", "PTH", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ARG", "B018"]
# Notebooks favour readable plotting calls over the line limit.
"notebooks/**" = ["E501"]

[tool.mypy]
strict = true
python_version = "3.12"
files = ["src", "tests"]
warn_unused_ignores = true
warn_redundant_casts = true

[[tool.mypy.overrides]]
module = ["rasterio.*", "pyproj.*", "pandas.*", "pyarrow.*", "xarray.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"

[tool.coverage.run]
source = ["egms_client"]

[tool.coverage.report]
fail_under = 90
show_missing = true
