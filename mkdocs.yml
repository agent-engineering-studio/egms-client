site_name: egms-client
site_description: Ground motion of Europe from space, in a few lines of Python (Copernicus EGMS)
site_url: https://agentengineering.it/egms-client/
repo_url: https://github.com/agent-engineering-studio/egms-client
repo_name: agent-engineering-studio/egms-client
edit_uri: edit/main/docs/
copyright: Code Apache-2.0. EGMS data © European Union, Copernicus Land Monitoring Service.

theme:
  name: material
  features:
    - navigation.sections
    - navigation.top
    - content.code.copy
    - search.highlight
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: blue grey
      toggle: {icon: material/weather-night, name: Dark mode}
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: blue grey
      toggle: {icon: material/weather-sunny, name: Light mode}

# llms.txt, llms-full.txt and the agent skill, built from the sources.
hooks:
  - hooks/llms.py

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            show_root_heading: true
            show_source: false
            members_order: source
            separate_signature: true
            show_signature_annotations: true
            filters: ["!^_"]

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc: {permalink: true}
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - pymdownx.snippets: {base_path: ["."], check_paths: true}
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

# The README and the notebooks README are written for GitHub: their relative
# links (LICENSE, notebooks/...) point at the repository, not at the site.
validation:
  links:
    not_found: info
    unrecognized_links: info
    anchors: info

nav:
  - Home: index.md
  - Notebooks: notebooks.md
  - API reference:
      - Client: api/client.md
      - Client without async: api/sync.md
      - Archive (pure functions): api/archive.md
      - Authentication: api/auth.md
      - Mosaics and maps: api/mosaic.md
      - Tables and GeoParquet: api/tables.md
      - Maps from L2 points: api/decompose.md
      - Time-series analysis: api/analysis.md
      - Command line: api/cli.md
      - MCP server: api/mcp.md
      - Errors: api/errors.md
  - Roadmap: roadmap.md
  - Changelog: changelog.md
  - Contributing: contributing.md
